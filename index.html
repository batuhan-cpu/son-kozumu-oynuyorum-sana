<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ceylin ❤️</title>
  <!-- Three.js Kütüphanesi (Görseldeki kodun çalışması için gerekli) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* TEKLİF KARTI */
    .card {
      background: rgba(18, 18, 30, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      padding: 35px 24px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      width: 90%;
      max-width: 420px;
      z-index: 10;
      position: relative;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 30px;
      font-weight: 600;
      line-height: 1.5;
      color: #f0f0f0;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 80px;
      position: relative;
    }

    button {
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #btn-yes {
      padding: 16px 36px;
      font-size: 1.25rem;
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 20px rgba(40, 167, 69, 0.6);
      z-index: 999;
      transform-origin: center;
    }

    #btn-no {
      padding: 16px 28px;
      font-size: 1.1rem;
      background-color: #dc3545;
      color: white;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.5);
      z-index: 1000;
      transform-origin: center;
    }

    /* THREE.JS NEON KALP EKRANI */
    #heart-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100000;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- TEKLİF KARTI -->
  <div class="card" id="main-card">
    <h2>Beni sevdin mi sevmedin mi orasını bilmem, benimle artık canım cicim aylarına geçmeye ne dersin? Benimle çıkar mısın? ❤️</h2>
    <div class="btn-container" id="btn-box">
      <button id="btn-yes">Evet</button>
      <button id="btn-no">Hayır</button>
    </div>
  </div>

  <!-- THREE.JS EKRANI -->
  <div id="heart-screen"></div>

  <script>
    // --- 1. BUTON HAREKETLERİ VE BÜYÜME/KÜÇÜLME MANTIĞI ---
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const mainCard = document.getElementById('main-card');
    const heartScreen = document.getElementById('heart-screen');

    let clickCount = 0;

    function handleNoClick(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      clickCount++;

      // Evet butonu büyür
      let yesScale = 1 + (clickCount * 0.6);
      btnYes.style.transform = `scale(${yesScale})`;

      // Hayır butonu küçülür
      let noScale = Math.max(0.2, 1 - (clickCount * 0.15));
      btnNo.style.transform = `scale(${noScale})`;

      // Hayır butonu rastgele kayar
      const randomX = (Math.random() - 0.5) * 160;
      const randomY = (Math.random() - 0.5) * 100;
      btnNo.style.position = 'relative';
      btnNo.style.left = `${randomX}px`;
      btnNo.style.top = `${randomY}px`;

      if (clickCount >= 6) {
        btnNo.style.display = 'none';
      }
    }

    btnNo.addEventListener('click', handleNoClick);
    btnNo.addEventListener('touchstart', handleNoClick, { passive: false });

    // Evet'e basıldığında Three.js animasyonunu başlat
    btnYes.addEventListener('click', function() {
      mainCard.style.display = 'none';
      heartScreen.style.display = 'block';
      initThreeHeart();
    });

    // --- 2. RESİMDEKİ KODUN (createHeartPath / THREE.JS) BİREBİR UYGULANMASI ---
    function initThreeHeart() {
      const container = document.getElementById('heart-screen');
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 30;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const totalParticles = 8000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(totalParticles * 3);
      const colors = new Float32Array(totalParticles * 3);

      // SSS'deki Koda Birebir Sadık Kalan createHeartPath Fonksiyonu
      function createHeartPath(particleIndex, totalParticles) {
        const t = (particleIndex / totalParticles) * Math.PI * 2;
        const scale = 2.2;

        // Matematiksel Kalp Formülü (x ve y için)
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

        const finalX = x * (scale / 16);
        const finalY = y * (scale / 16);
        const z = Math.sin(t * 4) * 2;

        const jitterStrength = 0.2;

        return new THREE.Vector3(
          finalX + (Math.random() - 0.5) * jitterStrength,
          finalY + (Math.random() - 0.5) * jitterStrength,
          z + (Math.random() - 0.5) * jitterStrength * 0.5
        );
      }

      // Parçacık Pozisyonlarını ve Renklerini Doldurma
      const colorPink = new THREE.Color(0xff007f);
      const colorPurple = new THREE.Color(0x9d00ff);

      for (let i = 0; i < totalParticles; i++) {
        const vec = createHeartPath(i, totalParticles);
        positions[i * 3] = vec.x;
        positions[i * 3 + 1] = vec.y;
        positions[i * 3 + 2] = vec.z;

        // Pembe/Mor Neon Hibrit Renk Geçişi
        const mixedColor = colorPink.clone().lerp(colorPurple, Math.random());
        colors[i * 3] = mixedColor.r;
        colors[i * 3 + 1] = mixedColor.g;
        colors[i * 3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // Neon Parlama Noktaları (PointsMaterial)
      const material = new THREE.PointsMaterial({
        size: 0.22,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });

      const heartPoints = new THREE.Points(geometry, material);
      scene.add(heartPoints);

      // Ekran Boyutu Değişirse Uyarla
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Animasyon Döngüsü
      function animate() {
        requestAnimationFrame(animate);

        // Kalbin Yavaşça Dönmesi ve Nabız Gibi Atması Efekti
        heartPoints.rotation.y += 0.008;
        heartPoints.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;
        
        const scalePulse = 1 + Math.sin(Date.now() * 0.003) * 0.05;
        heartPoints.scale.set(scalePulse, scalePulse, scalePulse);

        renderer.render(scene, camera);
      }

      animate();
    }
  </script>
</body>
</html>
